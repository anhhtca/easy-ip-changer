name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $exeSource = "target/x86_64-pc-windows-msvc/release/easy-ip-changer.exe"
          $exeDest = "dist/easy-ip-changer.exe"
          $zipDest = "dist/easy-ip-changer-windows-x64.zip"

          Copy-Item -Path $exeSource -Destination $exeDest -Force
          Compress-Archive -Path $exeDest -DestinationPath $zipDest -Force

          $checksums = @($exeDest, $zipDest) | ForEach-Object {
            $hash = (Get-FileHash -Path $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $_
            "$hash  $name"
          }
          $checksums | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8NoBOM

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-ip-changer-windows-x64
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
