[package]
name = "easy-ip-changer"
version = "1.0.0"
edition = "2024"
description = "Công cụ đổi nhanh địa chỉ IP tĩnh cho người dùng cuối trên Windows 10/11 Pro"
authors = ["anhhtca"]
build = "build.rs"

[dependencies]
slint = { version = "1.10", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
thiserror = "2"

[build-dependencies]
slint-build = "1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
